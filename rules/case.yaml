rules:
  - description: |
      All letters must be uppercase
    regex:
      pattern: "^[A-Z0-9.]+([.][a-zA-Z0-9]+)?$"
      case_insensitive: false
      expect: "match"
    rule_id: "uppercase"
    title: "Uppercase file names (ASCII)"

  - description: |
      All letters must be lowercase
    regex:
      pattern: "^[a-z0-9.]+([.][a-zA-Z0-9]+)?$"
      case_insensitive: false
      expect: "match"
    rule_id: "lowercase"
    title: "Lowercase"

